<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>참석자 관리</title>
<link rel="stylesheet" href="style.css?v=18">
<link rel="icon" href="favicon.png">
<script>try{localStorage.setItem("nl-hud:public:v1","hidden")}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap wide">
  <img src="logo.png" alt="이음교회" class="logo">
  <h1 id="title"></h1>

  <div class="card">
    <div class="topbar">
      <input id="pw" type="password" placeholder="비밀번호">
      <button class="btn" id="login">불러오기</button>
      <button class="btn ghost" id="excel" hidden>엑셀 다운로드</button>
    </div>
    <div class="err" id="err"></div>
    <div class="hint" id="notice"></div>
  </div>

  <div id="app" hidden>
    <div class="stats" id="stats"></div>
    <div class="card" id="kidsCard" hidden>
      <label style="margin-top:0">자녀 부서별</label>
      <div class="kids" id="kids"></div>
    </div>

    <div class="card">
      <div class="filters">
        <div><label>세부소속 (순장·리더·교사)</label><select id="fSub"><option value="">마스터 · 전체 보기</option></select></div>
        <div><label>이름 검색</label><input id="fName" placeholder="이름 일부 입력"></div>
      </div>
    </div>

    <div id="cards" class="cards"></div>
    <div class="tbl">
      <table>
        <thead><tr><th>신청자</th><th>소속</th><th>세부소속</th><th>인원</th><th>식사</th><th>교회차</th><th>참석자 명단</th><th>제출시각</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="config.js?v=18"></script>
<script>
const $ = id => document.getElementById(id);
$('title').textContent = CFG.TITLE + ' — 관리';
let DATA = [], PW = sessionStorage.getItem('pw') || '';
if (PW) $('pw').value = PW;

// 세부소속 필터 옵션
for (const [g, def] of Object.entries(CFG.GROUPS)) {
  const og = document.createElement('optgroup'); og.label = g;
  const list = def.items.length ? [...def.items, CFG.UNKNOWN] : [g];
  for (const s of list) { const o = document.createElement('option'); o.value = g + '|' + (def.items.length ? s : ''); o.textContent = def.items.length ? s : g; og.appendChild(o); }
  $('fSub').appendChild(og);
}

async function rpc(fn, args) {
  const res = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY, Authorization: 'Bearer ' + CFG.SUPABASE_KEY },
    body: JSON.stringify(args)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function load() {
  PW = $('pw').value.trim();
  $('err').textContent = '';
  try {
    if (!(await rpc('admin_check', { pw: PW }))) { $('err').textContent = '비밀번호가 틀렸습니다.'; return; }
    sessionStorage.setItem('pw', PW);
    DATA = await rpc('admin_list', { pw: PW });
    $('app').hidden = false; $('excel').hidden = false;
    render();
    await dedupe(true);
  } catch (e) { $('err').textContent = '불러오기 실패: ' + e.message; }
}
$('login').onclick = load;
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
if (PW) load();

const keyOf = n => CFG.nameKey(n);
// 사람 식별: 이름 같고 전화 규칙(뒤 8자리 중 6자리↑ 일치, 번호 없으면 이름만)에 맞으면 같은 사람 → 같은 식별키
let IDMAP = new Map(); // member 객체 → 식별키
function buildIdentity() {
  IDMAP = new Map(); const reps = []; // {key, name, phone}
  for (const s of DATA) for (const m of s.members) {
    let rep = reps.find(r => CFG.samePerson(r, m));
    if (!rep) { rep = { key: keyOf(m.name) + '#' + reps.length, name: m.name, phone: m.phone }; reps.push(rep); }
    else if (!CFG.phoneTail(rep.phone) && CFG.phoneTail(m.phone)) rep.phone = m.phone;
    IDMAP.set(m, rep.key);
  }
}
const idOf = m => IDMAP.get(m) || keyOf(m.name);
function nameCounts() {
  buildIdentity(); const c = {};
  for (const s of DATA) for (const m of s.members) c[idOf(m)] = (c[idOf(m)] || 0) + 1;
  return c;
}
// 중복 자동 정리: 같은 이름이 여러 신청서에 있으면 본인이 직접 낸 신청서(신청자=본인)를 우선, 없으면 가장 먼저 낸 것만 남김
// 자동 실행(불러오기 직후): 같은 사람이 여러 신청서에 있으면 본인이 직접 낸 신청서를 우선 남기고 나머지에서 뺀다
async function dedupe(auto) {
  const c = nameCounts(); const dups = Object.keys(c).filter(k => c[k] > 1);
  $('notice').textContent = '';
  if (!dups.length) { if (!auto) alert('중복된 이름이 없습니다.'); return; }
  const sorted = [...DATA].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  const plan = []; // {id, members}
  const keep = {};
  for (const k of dups) {
    const own = sorted.find(s => s.members.some(m => idOf(m) === k && keyOf(m.name) === keyOf(s.name)));
    keep[k] = own ? own.id : sorted.find(s => s.members.some(m => idOf(m) === k)).id;
  }
  for (const s of sorted) {
    const nm = s.members.filter(m => !(dups.includes(idOf(m)) && keep[idOf(m)] !== s.id));
    if (nm.length !== s.members.length) plan.push({ id: s.id, name: s.name, members: nm });
  }
  const desc = plan.map(p => `${p.name} 신청서 ${DATA.find(s => s.id === p.id).members.length}명 → ${p.members.length}명${p.members.length ? '' : ' (삭제)'}`).join(', ');
  if (!auto && !confirm(`중복 ${dups.length}명을 정리합니다.\n${desc}\n\n진행할까요?`)) return;
  try {
    for (const p of plan) {
      if (p.members.length) { await rpc('admin_set_members', { pw: PW, target: p.id, new_members: p.members }); DATA.find(s => s.id === p.id).members = p.members; }
      else { await rpc('admin_delete', { pw: PW, target: p.id }); DATA = DATA.filter(s => s.id !== p.id); }
    }
    render();
    $('notice').textContent = `중복 ${dups.length}명 자동 정리: ${desc}`;
  } catch (e) { alert('정리 실패: ' + e.message); }
}

function render() {
  const [fg, fs] = ($('fSub').value || '|').split('|');
  const q = $('fName').value.trim();
  let list = DATA;
  if (fg) list = list.filter(s => s.group_type === fg && (fs === '' ? true : s.sub_group === fs));
  if (q) list = list.filter(s => s.members.some(m => m.name.includes(q)) || s.name.includes(q));

  // 같은 이름은 1명으로 집계(식사·차량은 하나라도 O면 O)
  buildIdentity();
  const seen = new Map();
  for (const s of list) for (const m of s.members) {
    const k = idOf(m); const prev = seen.get(k) || { meal: 0, bus: 0, ex: 0 };
    const ok = CFG.countsFor(m);
    seen.set(k, { meal: prev.meal || (m.meal && ok ? 1 : 0), bus: prev.bus || (m.bus && ok ? 1 : 0), ex: prev.ex || (!ok && (m.meal || m.bus) ? 1 : 0) });
  }
  const people = [...seen.values()];
  const rawCount = list.reduce((a, s) => a + s.members.length, 0);
  const total = people.length, meal = people.filter(m => m.meal).length, bus = people.filter(m => m.bus).length;
  const excluded = people.filter(m => m.ex).length;
  const dupNote = rawCount > total ? ` · 중복 ${rawCount - total}명 제외` : '';
  const direct = list.length; // 세부소속 본인(신청자) 수
  $('stats').innerHTML = fg
    ? `<div class="stat"><div class="n">${direct}<span style="font-size:14px;color:#6b7280"> / ${total}</span></div><div class="l">참석인원(소속 본인) / 총인원(가족 포함${dupNote})</div></div>
       <div class="stat"><div class="n">${meal}</div><div class="l">식사 인원</div></div>
       <div class="stat"><div class="n">${bus}</div><div class="l">교회차 인원</div></div>`
    : `<div class="stat"><div class="n">${total}</div><div class="l">총 참석 인원 (신청 ${direct}건${dupNote})</div></div>
       <div class="stat"><div class="n">${meal}</div><div class="l">식사 인원</div></div>
       <div class="stat"><div class="n">${bus}</div><div class="l">교회차 인원</div></div>`;

  // 자녀 부서별 집계(같은 사람 1명으로)
  const kid = {}; for (const k of CFG.KIDS) kid[k.label] = { seen: new Set(), n: 0, meal: 0, bus: 0 };
  for (const s of list) for (const m of s.members) {
    const dpt = CFG.kidDept(m.birth_year); if (!dpt) continue;
    const key = idOf(m); if (kid[dpt].seen.has(key)) continue; kid[dpt].seen.add(key);
    kid[dpt].n++; if (m.meal && CFG.countsFor(m)) kid[dpt].meal++; if (m.bus && CFG.countsFor(m)) kid[dpt].bus++;
  }
  const kidTotal = Object.values(kid).reduce((a, k) => a + k.n, 0);
  $('kidsCard').hidden = false;
  $('kids').innerHTML = CFG.KIDS.map(k => `<div class="kid"><div class="kid-l">${k.label}<small>${k.from}~${k.to}년생</small></div><div class="kid-n">${kid[k.label].n}<small>명</small></div><div class="kid-s">식사 ${kid[k.label].meal} · 교회차 ${kid[k.label].bus}</div></div>`).join('')
    + `<div class="kid sum"><div class="kid-l">식사/교회차 미집계 인원<small>${String(CFG.EXCLUDE_BIRTH_FROM).slice(2)}년생 이후 출생자</small></div><div class="kid-n">${excluded}<small>명</small></div></div>`;

  // 이름 확인(오타 의심) 표시
  const all = DATA.flatMap(s => s.members); const typo = new Set();
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) if (CFG.likelyTypo(all[i], all[j])) { typo.add(all[i]); typo.add(all[j]); }

  const dup = nameCounts();
  // 명단 한 줄: 이름(생년) | 부서 | 식사 | 차량 | 전화 — 열 고정으로 줄 맞춤
  const memHtml = m => {
    const dpt = CFG.kidDept(m.birth_year);
    return `<span class="mem"><span class="c-name">${dup[idOf(m)] > 1 ? '⚠️ ' : ''}${esc(m.name)}${typo.has(m) ? ' <span class="badge warn">이름 확인</span>' : ''}${m.birth_year ? ' <small>(' + esc(m.birth_year) + ')</small>' : ''}</span><span class="c-dept">${dpt ? '<span class="badge kidb">' + dpt + '</span>' : ''}</span><span class="c-meal"><span class="badge ${m.meal ? '' : 'no'}">식사${m.meal ? 'O' : 'X'}</span></span><span class="c-bus"><span class="badge ${m.bus ? '' : 'no'}">차량${m.bus ? 'O' : 'X'}</span></span><span class="c-phone">${m.phone ? esc(m.phone) : ''}</span></span>`;
  };
  $('rows').innerHTML = list.map(s => `<tr>
    <td><b>${esc(s.name)}</b></td>
    <td>${esc(s.group_type)}</td>
    <td>${esc(s.sub_group) || '-'}</td>
    <td>${s.members.length}</td>
    <td>${s.members.filter(m => m.meal).length}</td>
    <td>${s.members.filter(m => m.bus).length}</td>
    <td>${s.members.map(memHtml).join('')}</td>
    <td style="white-space:nowrap;font-size:12px;color:#6b7280">${new Date(s.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
    <td><button class="btn danger" data-id="${s.id}" data-name="${esc(s.name)}">삭제</button></td>
  </tr>`).join('') || '<tr><td colspan="9" style="text-align:center;color:#9ca3af;padding:30px">데이터가 없습니다</td></tr>';

  // 모바일 카드
  $('cards').innerHTML = list.map(s => `<div class="scard">
    <div class="scard-h"><b>${esc(s.name)}</b><span class="hint">${esc(s.sub_group) || esc(s.group_type)}</span></div>
    <div class="scard-n">총 ${s.members.length}명 · 식사 ${s.members.filter(m => m.meal).length} · 교회차 ${s.members.filter(m => m.bus).length}</div>
    ${s.members.map(memHtml).join('')}
    <div class="scard-f"><span class="hint">${new Date(s.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span><button class="btn danger" data-id="${s.id}" data-name="${esc(s.name)}">삭제</button></div>
  </div>`).join('') || '<div class="card" style="text-align:center;color:#9ca3af">데이터가 없습니다</div>';
}
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
$('fSub').onchange = render; $('fName').oninput = render;

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  if (!confirm(`${b.dataset.name} 신청서를 삭제할까요?`)) return;
  try { await rpc('admin_delete', { pw: PW, target: b.dataset.id }); DATA = DATA.filter(s => s.id !== b.dataset.id); render(); }
  catch (err) { alert('삭제 실패: ' + err.message); }
});

$('excel').onclick = () => {
  // 시트1: 신청자별 (조사표 '최종페이지' 형식)
  const maxC = Math.max(0, ...DATA.map(s => s.members.length - 1));
  const s1 = DATA.map(s => {
    const me = s.members[0] || {};
    const r = { 이름: s.name, 소속: s.group_type, 세부소속: s.sub_group, 생년: me.birth_year || '', 전화번호: me.phone || '', '식사(0/1)': me.meal ? 1 : 0, '교회차(0/1)': me.bus ? 1 : 0 };
    for (let i = 1; i <= Math.max(maxC, 6); i++) r['동반#' + i] = s.members[i] ? s.members[i].name : '';
    r['총인원'] = s.members.length; r['식사인원'] = s.members.filter(m => m.meal).length; r['교회차인원'] = s.members.filter(m => m.bus).length;
    r['제출시각'] = new Date(s.created_at).toLocaleString('ko-KR');
    return r;
  });
  // 시트2: 개인별 전체 명단
  const s2 = DATA.flatMap(s => s.members.map((m, i) => ({ 이름: m.name, 구분: i === 0 ? '본인' : '동반', 부서: CFG.kidDept(m.birth_year), '식사·차량 집계': CFG.countsFor(m) ? '집계' : '미집계', 신청자: s.name, 소속: s.group_type, 세부소속: s.sub_group, 생년: m.birth_year || '', 전화번호: m.phone || '', '식사(0/1)': m.meal ? 1 : 0, '교회차(0/1)': m.bus ? 1 : 0 })));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(s1), '신청자별');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(s2), '전체명단');
  XLSX.writeFile(wb, `온가족예배_참석조사_${new Date().toISOString().slice(0, 10)}.xlsx`);
};
</script>
</body>
</html>
