<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>온가족예배 참석자 사전조사</title>
<link rel="stylesheet" href="style.css?v=27">
<link rel="icon" href="favicon.png">
<script>try{localStorage.setItem("nl-hud:public:v1","hidden")}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <button class="back" id="backTop" hidden>← 뒤로</button>
  <img src="logo.png" alt="이음교회" class="logo">
  <h1 id="title"></h1>
  <div class="steps" id="steps"><span class="st on">1 본인 정보</span><span class="st">2 참석 인원</span></div>

  <!-- 1단계 -->
  <div class="card" id="step1">
    <label>이름</label>
    <input id="name" placeholder="홍길동" autocomplete="name" autofocus>
    <label>소속</label>
    <select id="group"><option value="">선택하세요</option></select>
    <div id="subWrap" hidden>
      <label>세부소속</label>
      <select id="sub"></select>
    </div>
    <div class="err" id="err1"></div>
    <button class="btn" id="next">다음</button>
  </div>

  <!-- 2단계 -->
  <div class="card" id="step2" hidden>
    <p style="margin:0 0 14px;font-weight:700">본인 포함, 함께 참석하는 가족을 모두 적어 주세요</p>
    <div id="members"></div>
    <button class="btn ghost" id="add">+ 인원 추가</button>
    <div class="err" id="err2"></div>
    <button class="btn" id="submit">완료</button>
  </div>

  <!-- 완료 -->
  <div class="card ok" id="done" hidden>
    <div class="big">✅</div>
    <p style="font-weight:700;font-size:18px;margin:8px 0">제출되었습니다</p>
    <div class="hint" id="summary" style="text-align:left"></div>
    <button class="btn" onclick="location.reload()">완료</button>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <p id="modalMsg" style="white-space:pre-line;margin:0 0 14px"></p>
    <div id="modalBtns" class="modal-btns"></div>
  </div>
</div>

<script src="config.js?v=19"></script>
<script>
const $ = id => document.getElementById(id);
// 이름은 띄어쓰기 불가(중복 방지) — 입력 즉시 공백 제거
document.addEventListener('input', e => {
  if (e.target.matches('#name, .m-name') && /\s/.test(e.target.value)) e.target.value = e.target.value.replace(/\s+/g, '');
  if (e.target.matches('.m-phone')) { const f = CFG.fmtPhone(e.target.value); if (f !== e.target.value) e.target.value = f; }
  if (e.target.matches('.m-birth')) { const d = CFG.kidDept(e.target.value); const tag = e.target.parentElement.querySelector('.dept'); if (tag) tag.textContent = d ? d + ' (생년 기준 자동)' : ''; }
});
$('title').textContent = CFG.TITLE;
function setStep(n) { const st = document.querySelectorAll('#steps .st'); st.forEach((el, i) => { el.classList.toggle('on', i + 1 === n); el.classList.toggle('done', i + 1 < n); }); $('steps').hidden = n === 3; }
document.title = CFG.TITLE;

// 선택형 안내창: choose(메시지, [{label, value, primary}]) → Promise<value>
function choose(msg, btns) {
  return new Promise(resolve => {
    $('modalMsg').textContent = msg;
    $('modalBtns').innerHTML = '';
    for (const b of btns) {
      const el = document.createElement('button'); el.className = 'btn' + (b.primary ? '' : ' ghost'); el.textContent = b.label;
      el.onclick = () => { $('modal').hidden = true; resolve(b.value); };
      $('modalBtns').appendChild(el);
    }
    $('modal').hidden = false;
  });
}

// 소속 옵션
for (const g of Object.keys(CFG.GROUPS)) {
  const o = document.createElement('option'); o.value = g; o.textContent = g; $('group').appendChild(o);
}
const opt = s => `<option>${String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))}</option>`;
$('group').addEventListener('change', () => {
  const g = $('group').value;
  $('sub').innerHTML = '';
  if (!CFG.hasSub(g)) { $('subWrap').hidden = true; return; }
  $('subWrap').hidden = false;
  $('sub').innerHTML = `<option value="">${CFG.GROUPS[g].hint}</option>` + CFG.subOptionsHtml(g);
});

// 2단계 명단
function addMember(name = '', isSelf = false) {
  const d = document.createElement('div');
  d.className = 'member';
  const seg = (cls, opts) => `<input type="hidden" class="${cls}"><div class="seg">${opts.map(([v, t]) => `<button type="button" data-v="${v}">${t}</button>`).join('')}</div>`;
  d.innerHTML = `
    <div class="member-h"><h4>${isSelf ? '본인' : '동반 가족'}</h4>${isSelf ? '' : '<button type="button" class="rm" aria-label="삭제">삭제</button>'}</div>
    <div class="row">
      <div><label>이름</label><input class="m-name" placeholder="이름" autocomplete="off"></div>
      <div><label>생년 (4자리)${isSelf ? ' <em>필수</em>' : ''}</label><input class="m-birth" inputmode="numeric" maxlength="4" placeholder="1980" autocomplete="off"><div class="dept hint"></div></div>
      <div><label>전화번호${isSelf ? ' <em>필수</em>' : ''}</label><input class="m-phone" inputmode="numeric" maxlength="13" placeholder="01012345678" autocomplete="off"></div>
      <div class="row-gap"></div>
      <div><label>식사</label>${seg('m-meal', CFG.MEAL)}</div>
      <div><label>교회 차량</label>${seg('m-bus', CFG.BUS)}</div>
    </div>`;
  d.querySelector('.m-name').value = name;
  d.querySelectorAll('.seg').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    g.previousElementSibling.value = b.dataset.v;
  }));
  $('members').appendChild(d);
  const rm = d.querySelector('.rm'); if (rm) rm.onclick = () => d.remove();
}

$('next').onclick = () => {
  const name = $('name').value.replace(/\s+/g, ''), g = $('group').value;
  const needSub = CFG.hasSub(g);
  if (!name) { $('err1').textContent = '이름을 입력해 주세요.'; $('name').focus(); return; }
  if (!g) { $('err1').textContent = '소속을 선택해 주세요.'; $('group').focus(); return; }
  if (needSub && !$('sub').value) { $('err1').textContent = '세부소속을 선택해 주세요.'; $('sub').focus(); return; }
  $('err1').textContent = '';
  $('members').innerHTML = '';
  addMember(name, true);
  $('step1').hidden = true; $('step2').hidden = false; $('backTop').hidden = false;
  setStep(2);
  window.scrollTo(0, 0);
};
$('add').onclick = () => addMember();
function goStep1() { $('step2').hidden = true; $('done').hidden = true; $('step1').hidden = false; setStep(1); $('backTop').hidden = true; }
$('backTop').onclick = () => { if (!$('done').hidden) location.reload(); else goStep1(); };

$('submit').onclick = async () => {
  const rows = [...document.querySelectorAll('.member')];
  const members = [];
  for (const r of rows) {
    const m = {
      name: r.querySelector('.m-name').value.replace(/\s+/g, ''),
      birth_year: r.querySelector('.m-birth').value.trim(),
      phone: CFG.fmtPhone(r.querySelector('.m-phone').value),
      meal: r.querySelector('.m-meal').value,
      bus: r.querySelector('.m-bus').value
    };
    // 아무것도 안 적은 동반 칸은 건너뜀(인원 추가만 누르고 안 쓴 경우)
    const isSelf = r === rows[0];
    if (!isSelf && !m.name && !m.birth_year && !m.phone && m.meal === '' && m.bus === '') { r.remove(); continue; }
    const fail = msg => { $('err2').textContent = msg; $('err2').scrollIntoView({ block: 'center', behavior: 'smooth' }); return true; };
    if (!m.name) return fail('이름이 비어 있는 칸이 있습니다.');
    if (isSelf && !/^\d{4}$/.test(m.birth_year)) return fail('본인 생년 4자리를 입력해 주세요.');
    if (isSelf && CFG.phoneTail(m.phone).length < 8) return fail('본인 전화번호를 입력해 주세요.');
    if (m.meal === '' || m.bus === '') return fail(`${m.name}님의 식사·차량을 선택해 주세요.`);
    m.meal = +m.meal; m.bus = +m.bus;
    members.push(m);
  }
  $('err2').textContent = '';
  $('submit').disabled = true; $('submit').textContent = '저장 중…';
  const g = $('group').value;
  const body = { name: $('name').value.replace(/\s+/g, ''), group_type: g, sub_group: CFG.hasSub(g) ? $('sub').value : '', members };
  const H = { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY, Authorization: 'Bearer ' + CFG.SUPABASE_KEY, Prefer: 'return=minimal' };
  try {
    // 0) 오타 재확인: 전화가 비슷한 기존 등록자 중 이름이 한 글자만 다른 사람이 있으면 묻는다
    const tails = [...new Set(members.map(m => CFG.phoneTail(m.phone)).filter(t => t.length === 8))];
    if (tails.length) {
      const fs = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/find_similar', { method: 'POST', headers: H, body: JSON.stringify({ p_tails: tails }) });
      const sim = fs.ok ? await fs.json() : [];
      for (const m of members) {
        const c = sim.find(x => CFG.likelyTypo(m, { name: x.person, phone: x.phone, birth_year: x.birth_year }));
        if (!c) continue;
        const info = x => `${x.name} (${x.birth_year || '생년 없음'} · ${x.phone || '번호 없음'})`;
        const pick = await choose(`혹시 이분과 같은 분인가요?\n\n기존: ${info({ name: c.person, birth_year: c.birth_year, phone: c.phone })}\n입력: ${info(m)}`, [
          { label: '같은 사람입니다 (기존 이름으로 수정)', value: 'same', primary: true }, { label: '다른 사람입니다', value: 'diff' }]);
        if (pick === 'same') { m.name = c.person; if (m === members[0]) body.name = c.person; const r = document.querySelectorAll('.member')[members.indexOf(m)]; if (r) r.querySelector('.m-name').value = c.person; }
      }
    }
    // 본인·동반 이름으로 기존 등록자 조회 → 같은 사람 판정(이름·생년·전화)
    const fp = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/find_persons', { method: 'POST', headers: H, body: JSON.stringify({ p_names: members.map(m => m.name) }) });
    const found = fp.ok ? await fp.json() : [];
    const asPerson = f => ({ name: f.person, phone: f.phone, birth_year: f.birth_year, distinct: f.distinct });
    let res, replaceId = null;
    // 1) 본인이 직접 낸 기존 신청서가 있으면 → 교체
    const own = found.find(f => f.is_self && CFG.samePerson(members[0], asPerson(f)));
    if (own) {
      const c = await choose(`${body.name}님은 이미 제출한 신청이 있습니다.\n\n[수정하기]를 누르면 기존 신청이 이번 내용(참석 인원·식사·차량)으로 바뀝니다.`, [
        { label: '수정하기', value: 'update', primary: true }, { label: '취소', value: 'cancel' }]);
      if (c !== 'update') { $('submit').disabled = false; $('submit').textContent = '완료'; return; }
      replaceId = own.sid;
    }
    // 2) 그 외 이미 다른 신청서에 들어 있는 같은 사람 → 그 자리의 정보를 이번 내용으로 수정
    const others = found.filter(f => !(own && f.sid === own.sid));
    const matchOf = m => others.filter(f => CFG.samePerson(m, asPerson(f)));
    const dupList = members.map(m => ({ m, hits: matchOf(m) })).filter(x => x.hits.length);
    let updated = [];
    if (dupList.length) {
      const dupNames = dupList.map(x => `${x.m.name}님 (${[...new Set(x.hits.map(h => h.submitter))].join(', ')}님 신청서)`);
      const rest = members.filter(m => !dupList.some(x => x.m === m));
      const c2 = await choose(`아래 분은 이미 다른 신청서에 등록되어 있습니다.\n\n${dupNames.join('\n')}\n\n[수정하기]를 누르면 식사·차량 등 정보가 이번 내용으로 바뀝니다.`, [
        { label: '수정하기', value: 'update', primary: true }, { label: '취소', value: 'cancel' }]);
      if (c2 !== 'update') { $('submit').disabled = false; $('submit').textContent = '완료'; return; }
      {
        for (const x of dupList) for (const h of x.hits) {
          const u = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/update_member', { method: 'POST', headers: H, body: JSON.stringify({ p_sid: h.sid, p_name: x.m.name, p_member: x.m }) });
          if (!u.ok) throw new Error(await u.text());
        }
        updated = dupList.map(x => x.m);
        if (!rest.length) {
          $('step2').hidden = true; $('done').hidden = false; setStep(3);
          $('summary').textContent = `${updated.map(m => m.name).join(', ')}님의 식사·차량 정보를 수정했습니다.`;
          window.scrollTo(0, 0); return;
        }
        members.length = 0; members.push(...rest); body.members = members;
        if (body.name !== members[0].name) body.name = members[0].name; // 본인이 빠졌으면 첫 사람을 신청자로
      }
    }
    if (replaceId) {
      res = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/replace_submission_by_id', { method: 'POST', headers: H, body: JSON.stringify({ p_id: replaceId, p_name: body.name, p_group: body.group_type, p_sub: body.sub_group, p_members: members }) });
    } else {
      res = await fetch(CFG.SUPABASE_URL + '/rest/v1/submissions', { method: 'POST', headers: H, body: JSON.stringify(body) });
    }
    if (!res.ok) throw new Error(await res.text());
    $('step2').hidden = true; $('done').hidden = false; setStep(3);
    const meal = members.filter(m => m.meal).length, bus = members.filter(m => m.bus).length;
    $('summary').innerHTML = `<b>총 ${members.length}명 참석</b> · 식사 ${meal}명 · 교회차 ${bus}명` + (updated.length ? `<br><small>${updated.map(m => m.name).join(', ')}님은 기존 정보를 수정했습니다</small>` : '')
      + `<ul class="done-list">${members.map(m => `<li>${m.name}${m.birth_year ? ' (' + m.birth_year + ')' : ''} — ${m.meal ? '식사함' : '식사안함'} · ${m.bus ? '교회차량' : '차량불필요'}</li>`).join('')}</ul>`;
    window.scrollTo(0, 0);
  } catch (e) {
    $('err2').textContent = '저장에 실패했습니다. 잠시 후 다시 시도해 주세요.';
    $('submit').disabled = false; $('submit').textContent = '완료';
    console.error(e);
  }
};
</script>
</body>
</html>
