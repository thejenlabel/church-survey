<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>온가족예배 참석자 사전조사</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<div class="wrap">
  <button class="back" id="backTop" hidden>← 뒤로</button>
  <h1 id="title"></h1>
  <p class="sub" id="stepText">1단계 · 본인 정보</p>

  <!-- 1단계 -->
  <div class="card" id="step1">
    <label>이름</label>
    <input id="name" placeholder="홍길동 (띄어쓰기 없이)" autocomplete="name">
    <label>소속</label>
    <select id="group"><option value="">선택하세요</option></select>
    <div id="subWrap" hidden>
      <label>세부소속</label>
      <select id="sub"></select>
    </div>
    <div class="err" id="err1"></div>
    <button class="btn" id="next">다음</button>
  </div>

  <!-- 2단계 -->
  <div class="card" id="step2" hidden>
    <p style="margin:0 0 4px;font-weight:700">본인 포함 온가족 예배 참석 여부</p>
    <p class="hint" style="margin:0 0 14px">본인 포함, 함께 참석하는 가족 이름을 모두 적어 주세요.</p>
    <div id="members"></div>
    <button class="btn ghost" id="add">+ 인원 추가</button>
    <div class="err" id="err2"></div>
    <button class="btn" id="submit">완료</button>
  </div>

  <!-- 완료 -->
  <div class="card ok" id="done" hidden>
    <div class="big">✅</div>
    <p style="font-weight:700;font-size:18px;margin:8px 0">제출되었습니다</p>
    <p class="hint" id="summary"></p>
    <button class="btn" onclick="location.reload()">완료</button>
  </div>
</div>

<script src="config.js?v=9"></script>
<script>
const $ = id => document.getElementById(id);
// 이름은 띄어쓰기 불가(중복 방지) — 입력 즉시 공백 제거
document.addEventListener('input', e => {
  if (e.target.matches('#name, .m-name') && /\s/.test(e.target.value)) e.target.value = e.target.value.replace(/\s+/g, '');
  if (e.target.matches('.m-phone')) { const f = CFG.fmtPhone(e.target.value); if (f !== e.target.value) e.target.value = f; }
});
$('title').textContent = CFG.TITLE;
document.title = CFG.TITLE;

// 소속 옵션
for (const g of Object.keys(CFG.GROUPS)) {
  const o = document.createElement('option'); o.value = g; o.textContent = g; $('group').appendChild(o);
}
const opt = s => `<option>${String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))}</option>`;
$('group').addEventListener('change', () => {
  const g = $('group').value;
  $('sub').innerHTML = '';
  if (!CFG.hasSub(g)) { $('subWrap').hidden = true; return; }
  $('subWrap').hidden = false;
  $('sub').innerHTML = `<option value="">${CFG.GROUPS[g].hint}</option>` + CFG.subOptionsHtml(g);
});

// 2단계 명단
function addMember(name = '', isSelf = false) {
  const d = document.createElement('div');
  d.className = 'member';
  d.innerHTML = `
    <h4>${isSelf ? '본인' : '동반 가족'}</h4>
    ${isSelf ? '' : '<button class="rm" title="삭제">×</button>'}
    <div class="row">
      <div><label>이름</label><input class="m-name" placeholder="이름"></div>
      <div><label>생년 (4자리)</label><input class="m-birth" inputmode="numeric" maxlength="4" placeholder="1980"></div>
      <div><label>전화번호</label><input class="m-phone" inputmode="numeric" maxlength="13" placeholder="숫자만 입력 (대시 자동)"></div>
      <div></div>
      <div><label>식사 여부</label><select class="m-meal"><option value="">선택</option>${CFG.MEAL.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></div>
      <div><label>교회 차량</label><select class="m-bus"><option value="">선택</option>${CFG.BUS.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select></div>
    </div>`;
  d.querySelector('.m-name').value = name;
  $('members').appendChild(d);
  const rm = d.querySelector('.rm'); if (rm) rm.onclick = () => d.remove();
}

$('next').onclick = () => {
  const name = $('name').value.replace(/\s+/g, ''), g = $('group').value;
  const needSub = CFG.hasSub(g);
  if (!name) return $('err1').textContent = '이름을 입력해 주세요.';
  if (!g) return $('err1').textContent = '소속을 선택해 주세요.';
  if (needSub && !$('sub').value) return $('err1').textContent = '세부소속을 선택해 주세요.';
  $('err1').textContent = '';
  $('members').innerHTML = '';
  addMember(name, true);
  $('step1').hidden = true; $('step2').hidden = false; $('backTop').hidden = false;
  $('stepText').textContent = '2단계 · 참석 인원';
  window.scrollTo(0, 0);
};
$('add').onclick = () => addMember();
function goStep1() { $('step2').hidden = true; $('done').hidden = true; $('step1').hidden = false; $('stepText').textContent = '1단계 · 본인 정보'; $('backTop').hidden = true; }
$('backTop').onclick = () => { if (!$('done').hidden) location.reload(); else goStep1(); };

$('submit').onclick = async () => {
  const rows = [...document.querySelectorAll('.member')];
  const members = [];
  for (const r of rows) {
    const m = {
      name: r.querySelector('.m-name').value.replace(/\s+/g, ''),
      birth_year: r.querySelector('.m-birth').value.trim(),
      phone: CFG.fmtPhone(r.querySelector('.m-phone').value),
      meal: r.querySelector('.m-meal').value,
      bus: r.querySelector('.m-bus').value
    };
    // 아무것도 안 적은 동반 칸은 건너뜀(인원 추가만 누르고 안 쓴 경우)
    const isSelf = r === rows[0];
    if (!isSelf && !m.name && !m.birth_year && !m.phone && m.meal === '' && m.bus === '') { r.remove(); continue; }
    if (!m.name) return $('err2').textContent = '이름이 비어 있는 칸이 있습니다.';
    if (m.meal === '' || m.bus === '') return $('err2').textContent = `${m.name}님의 식사·차량 여부를 선택해 주세요.`;
    m.meal = +m.meal; m.bus = +m.bus;
    members.push(m);
  }
  $('err2').textContent = '';
  $('submit').disabled = true; $('submit').textContent = '저장 중…';
  const g = $('group').value;
  const body = { name: $('name').value.replace(/\s+/g, ''), group_type: g, sub_group: CFG.hasSub(g) ? $('sub').value : '', members };
  const H = { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY, Authorization: 'Bearer ' + CFG.SUPABASE_KEY, Prefer: 'return=minimal' };
  try {
    // 같은 이름·소속으로 이미 제출됐는지 확인
    const dupRes = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/find_dup', { method: 'POST', headers: H, body: JSON.stringify({ p_name: body.name, p_group: body.group_type, p_sub: body.sub_group }) });
    const dup = dupRes.ok ? await dupRes.json() : 0;
    let res;
    if (dup === 0) {
      // 본인·동반 중 이미 다른 신청서에 등록된 사람 확인
      const fp = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/find_persons', { method: 'POST', headers: H, body: JSON.stringify({ p_names: members.map(m => m.name) }) });
      const found = fp.ok ? await fp.json() : [];
      // found: 같은 이름의 기존 등록자 [{person, phone, submitter}] → 전화번호 규칙으로 같은 사람만 중복 처리
      const matchOf = m => [...new Set(found.filter(f => CFG.samePerson(m, { name: f.person, phone: f.phone })).map(f => f.submitter))];
      const dupList = members.map(m => ({ m, subs: matchOf(m) })).filter(x => x.subs.length);
      if (dupList.length) {
        const dupNames = dupList.map(x => `${x.m.name}님 (${x.subs.join(', ')}님 신청서)`);
        const rest = members.filter(m => !dupList.some(x => x.m === m));
        if (!rest.length) {
          alert(`이미 등록되어 있어 다시 제출할 필요가 없습니다.\n\n${dupNames.join('\n')}\n\n수정이 필요하면 해당 신청서를 제출한 분이 다시 제출해 주세요.`);
          $('submit').disabled = false; $('submit').textContent = '완료'; return;
        }
        if (!confirm(`아래 분은 이미 다른 신청서에 등록되어 있습니다.\n\n${dupNames.join('\n')}\n\n이분들은 빼고 나머지 ${rest.length}명만 저장할까요?`)) {
          $('submit').disabled = false; $('submit').textContent = '완료'; return;
        }
        members.length = 0; members.push(...rest); body.members = members;
        if (body.name !== members[0].name) body.name = members[0].name; // 본인이 빠졌으면 첫 사람을 신청자로
      }
    }
    if (dup > 0) {
      if (!confirm(`${body.name}님은 이미 제출된 신청이 있습니다.\n기존 신청을 지우고 이번 내용으로 교체할까요?`)) {
        $('submit').disabled = false; $('submit').textContent = '완료'; return;
      }
      res = await fetch(CFG.SUPABASE_URL + '/rest/v1/rpc/replace_submission', { method: 'POST', headers: H, body: JSON.stringify({ p_name: body.name, p_group: body.group_type, p_sub: body.sub_group, p_members: members }) });
    } else {
      res = await fetch(CFG.SUPABASE_URL + '/rest/v1/submissions', { method: 'POST', headers: H, body: JSON.stringify(body) });
    }
    if (!res.ok) throw new Error(await res.text());
    $('step2').hidden = true; $('done').hidden = false; $('stepText').textContent = '완료';
    const meal = members.filter(m => m.meal).length, bus = members.filter(m => m.bus).length;
    $('summary').textContent = `${body.name} 외 ${members.length - 1}명 · 총 ${members.length}명 참석 · 식사 ${meal}명 · 교회차 ${bus}명`;
    window.scrollTo(0, 0);
  } catch (e) {
    $('err2').textContent = '저장에 실패했습니다. 잠시 후 다시 시도해 주세요.';
    $('submit').disabled = false; $('submit').textContent = '완료';
    console.error(e);
  }
};
</script>
</body>
</html>
