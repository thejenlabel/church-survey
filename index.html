<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>온가족예배 참석자 사전조사</title>
<link rel="stylesheet" href="style.css?v=58">
<link rel="icon" href="favicon.png">
<script>try{localStorage.setItem("nl-hud:public:v1","hidden")}catch(e){}</script>
</head>
<body>
<div class="wrap">
  <button class="back" id="backTop" hidden>← 뒤로</button>
  <img src="logo.png" alt="이음교회" class="logo">
  <h1 id="title"></h1>
  <div class="steps" id="steps"><span class="st on">1 본인</span><span class="st">2 소속</span><span class="st">3 참석 인원</span></div>

  <!-- 1단계: 이름·전화 -->
  <div class="card" id="step1">
    <label>이름 <em>필수</em></label>
    <input id="name" placeholder="홍길동" autocomplete="name" autofocus>
    <label>전화번호 <em>필수</em></label>
    <input id="phone" class="m-phone" inputmode="numeric" maxlength="13" placeholder="01012345678" autocomplete="tel">
    <div class="err" id="err1"></div>
    <button class="btn" id="next1">다음</button>
  </div>

  <!-- 2단계: 소속 -->
  <div class="card" id="stepG" hidden>
    <label>소속 <em>필수</em></label>
    <select id="group"><option value="">선택하세요</option></select>
    <div id="subWrap" hidden>
      <label>세부소속 <em>필수</em></label>
      <select id="sub"></select>
    </div>
    <div class="err" id="errG"></div>
    <button class="btn" id="next2">다음</button>
  </div>

  <!-- 3단계: 참석 인원 -->
  <div class="card" id="step2" hidden>
    <p style="margin:0 0 14px;font-weight:700" id="step2Title">본인 포함, 함께 참석하는 가족을 모두 적어 주세요</p>
    <div id="members"></div>
    <button class="btn ghost" id="add">+ 인원 추가</button>
    <div class="err" id="err2"></div>
    <button class="btn" id="submit">완료</button>
  </div>

  <!-- 완료 -->
  <div class="card ok" id="done" hidden>
    <div class="big">✅</div>
    <p style="font-weight:700;font-size:18px;margin:8px 0">제출되었습니다</p>
    <div class="hint" id="summary" style="text-align:left"></div>
    <button class="btn" onclick="location.reload()">완료</button>
  </div>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <p id="modalMsg" style="white-space:pre-line;margin:0 0 14px"></p>
    <div id="modalBtns" class="modal-btns"></div>
  </div>
</div>

<script>window.FORM_MODE = "all";</script>
<script src="config.js?v=28"></script>
<script src="form.js?v=2"></script>
</body>
</html>
